[package]
name = "attribrustor"
version = "0.1.0"
edition = "2018"

[dependencies]
wasm-bindgen = "0.2.74"
# Le kernel lit le plan transmis par le nœud (groupes fixes, dépendance) avec
# `Reflect`, donc il lui faut l'interface JavaScript. Sans elle, le port devrait
# inventer sa propre façon de décoder le plan — et donc un second contrat.
js-sys = "0.3"

[lib]
crate-type = ["cdylib", "rlib"]